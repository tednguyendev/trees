<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping - Satellite View</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            dark: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    #map { width: 100%; height: 100%; background: #000; }
    .leaflet-container { background: #000; }
    .leaflet-control-attribution { display: none; }

    /* Tree view styles */
    .tree-item { user-select: none; }
    .tree-item:hover { background: rgba(255,255,255,0.05); }
    .tree-children { display: none; }
    .tree-children.expanded { display: block; }
    .tree-toggle { transition: transform 0.2s; }
    .tree-toggle.expanded { transform: rotate(90deg); }

    /* Tree marker */
    .tree-marker-svg { background: transparent !important; border: none !important; }
    .tree-dragging { cursor: grabbing !important; }
    .tree-dragging * { cursor: grabbing !important; }

    /* Tree label */
    .tree-label {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      transform: translateY(-45px);
    }
  </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col font-['Inter']">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-10 h-10 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center transition-colors">
        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold text-white">Satellite View</h1>
        <p class="text-xs text-slate-400">Hierarchy + Edit</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Species Filter -->
      <div class="relative">
        <button id="speciesBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <span id="speciesLabel">All Species</span>
        </button>
        <div id="speciesDropdown" class="hidden absolute right-0 mt-2 w-56 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-slate-700 flex justify-between items-center">
            <span class="text-sm font-medium text-white">Species</span>
            <button id="speciesSelectAll" class="text-xs text-green-400 hover:text-green-300">Select All</button>
          </div>
          <div id="speciesList" class="max-h-64 overflow-y-auto p-2">
            <!-- Generated by JS -->
          </div>
        </div>
      </div>

      <!-- Risk Filter -->
      <div class="relative">
        <button id="riskBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span id="riskLabel">All Risk</span>
        </button>
        <div id="riskDropdown" class="hidden absolute right-0 mt-2 w-48 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-slate-700">
            <span class="text-sm font-medium text-white">Risk Level</span>
          </div>
          <div id="riskList" class="p-2">
            <!-- Generated by JS -->
          </div>
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="px-4 py-2 text-sm bg-green-500 hover:bg-green-600 text-white rounded-lg flex items-center gap-2 font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add Tree
      </button>

      <button id="exportKmlBtn" class="px-4 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        KML
      </button>

      <button id="resetBtn" class="p-2 text-sm bg-slate-700 hover:bg-slate-600 text-slate-400 rounded-lg transition-colors" title="Reset to default">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Sidebar - Folder Tree -->
    <div class="w-72 bg-slate-800 border-r border-slate-700 flex flex-col">
      <div class="px-4 py-3 border-b border-slate-700">
        <h2 class="text-sm font-medium text-white flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
          Places
        </h2>
      </div>

      <div id="treeView" class="flex-1 overflow-y-auto p-2 text-sm">
        <!-- Generated by JS -->
      </div>

      <!-- Stats -->
      <div class="px-4 py-3 border-t border-slate-700">
        <h3 class="text-xs text-slate-400 uppercase mb-2">Statistics</h3>
        <div class="grid grid-cols-4 gap-2 text-center">
          <div>
            <div id="statTotal" class="text-lg font-bold text-white">0</div>
            <div class="text-[10px] text-slate-400">Total</div>
          </div>
          <div>
            <div id="statLow" class="text-lg font-bold text-green-400">0</div>
            <div class="text-[10px] text-slate-400">Low</div>
          </div>
          <div>
            <div id="statMedium" class="text-lg font-bold text-amber-400">0</div>
            <div class="text-[10px] text-slate-400">Med</div>
          </div>
          <div>
            <div id="statHigh" class="text-lg font-bold text-red-400">0</div>
            <div class="text-[10px] text-slate-400">High</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="flex-1 relative">
      <div id="map"></div>

      <!-- Add Tree Mode Indicator -->
      <div id="addTreeMode" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-[9999] flex items-center gap-3">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="text-sm font-medium">Click on map to place tree</span>
        <button id="cancelAddTree" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm">Cancel</button>
      </div>

      <!-- Filtered Trees Panel -->
      <div id="filteredPanel" class="hidden absolute top-4 right-4 w-64 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[1000] flex flex-col max-h-[calc(100%-2rem)]">
        <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
          <div>
            <h3 class="text-sm font-medium text-white">Filtered Trees</h3>
            <p id="filteredCount" class="text-xs text-slate-400">0 trees</p>
          </div>
          <button id="closeFilteredPanel" class="w-6 h-6 flex items-center justify-center rounded hover:bg-slate-700 transition-colors">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div id="filteredTreeList" class="flex-1 overflow-y-auto">
          <!-- Generated by JS -->
        </div>
        <div class="px-3 py-2 border-t border-slate-700 flex items-center justify-between gap-2">
          <button id="prevTreeBtn" class="flex-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded text-sm flex items-center justify-center gap-1 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Prev
          </button>
          <span id="treeNavIndex" class="text-xs text-slate-400 min-w-[60px] text-center">- / 0</span>
          <button id="nextTreeBtn" class="flex-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white rounded text-sm flex items-center justify-center gap-1 transition-colors">
            Next
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[9999]">
    <div class="bg-slate-800 rounded-lg shadow-xl w-[360px] border border-slate-700 overflow-hidden">
      <div class="bg-green-500 px-5 py-3 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-semibold text-white">New Tree</h2>
        <button id="cancelModal" class="w-7 h-7 flex items-center justify-center rounded bg-white/20 hover:bg-white/30 transition-all">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <input type="hidden" id="treeId">
      <input type="hidden" id="treeLat">
      <input type="hidden" id="treeLng">

      <div class="p-5 space-y-4">
        <div>
          <label class="block text-xs text-slate-400 uppercase mb-1.5">Species</label>
          <select id="treeSpecies" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-green-500">
            <option value="Rain Tree">Rain Tree</option>
            <option value="Tembusu">Tembusu</option>
            <option value="Angsana">Angsana</option>
            <option value="Sea Apple">Sea Apple</option>
            <option value="Yellow Flame">Yellow Flame</option>
            <option value="Saga">Saga</option>
            <option value="Frangipani">Frangipani</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 uppercase mb-1.5">Risk Level</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="low" checked class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-green-500/20 peer-checked:border-green-500 peer-checked:text-green-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 mr-1"></span>Low
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="medium" class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-1"></span>Med
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="high" class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-red-500/20 peer-checked:border-red-500 peer-checked:text-red-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 mr-1"></span>High
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="flex gap-2 px-5 pb-5">
        <button id="deleteTreeBtn" class="hidden px-3 py-2 bg-red-500/20 border border-red-500/50 text-red-400 rounded-lg hover:bg-red-500/30 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium transition-all">
          Save Tree
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Data -->
  <script src="data.js"></script>

  <script>
    // State
    const savedTrees = localStorage.getItem('trees');
    let trees = (savedTrees && JSON.parse(savedTrees).length > 0) ? JSON.parse(savedTrees) : [...defaultTrees];
    let zones = [...defaultZones];
    let treeCounter = parseInt(localStorage.getItem('treeCounter')) || 50;
    let treeMarkers = {};
    let treeLabelMarkers = {};
    let isAddingTree = false;
    let editingTreeId = null;
    let selectedSpecies = new Set(); // empty = all
    let selectedRisks = new Set(['low', 'medium', 'high']); // all checked by default

    // Risk colors
    const riskColors = {
      low: { color: '#22c55e', name: 'Low' },
      medium: { color: '#f59e0b', name: 'Medium' },
      high: { color: '#ef4444', name: 'High' }
    };

    // Initialize map
    const map = L.map('map', {
      center: [1.4040, 103.7900],
      zoom: 16,
      zoomControl: false
    });

    // Satellite imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Layer groups
    const zonesLayer = L.featureGroup().addTo(map);
    const treesLayer = L.featureGroup().addTo(map);
    const labelsLayer = L.featureGroup().addTo(map);

    // Create tree icon
    function createTreeIcon(color, isDragging = false) {
      const shadow = isDragging ? 'filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));' : 'filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));';
      const transform = isDragging ? 'transform: scale(1.2) translateY(-4px);' : '';

      const svg = `
        <div style="${transform} transition: transform 0.15s ease-out;">
          <svg width="28" height="36" viewBox="0 0 28 36" style="${shadow}">
            <path d="M14 2 L22 14 L18 14 L24 24 L4 24 L10 14 L6 14 Z" fill="${color}" stroke="${color}" stroke-width="1" stroke-linejoin="round"/>
            <rect x="11" y="24" width="6" height="8" fill="#8B4513" rx="1"/>
            <path d="M14 4 L18 10 L15 10 L19 17 L9 17 L13 10 L10 10 Z" fill="white" opacity="0.25"/>
          </svg>
        </div>
      `;

      return L.divIcon({
        className: 'tree-marker-svg',
        html: svg,
        iconSize: [28, 36],
        iconAnchor: [14, 36]
      });
    }

    // Add tree to map
    function addTreeToMap(tree) {
      const color = riskColors[tree.risk].color;

      const marker = L.marker([tree.lat, tree.lng], {
        icon: createTreeIcon(color),
        draggable: true
      });

      // Click to edit
      marker.on('click', function(e) {
        if (!isAddingTree) {
          showEditModal(tree);
        }
      });

      marker.on('dragstart', function() {
        document.body.classList.add('tree-dragging');
        marker.setIcon(createTreeIcon(color, true));
      });

      marker.on('dragend', function() {
        document.body.classList.remove('tree-dragging');
        marker.setIcon(createTreeIcon(color, false));
        const pos = marker.getLatLng();
        tree.lat = pos.lat;
        tree.lng = pos.lng;
        if (treeLabelMarkers[tree.id]) {
          treeLabelMarkers[tree.id].setLatLng(pos);
        }
        saveData();
        renderTreeView();
        populateSpeciesFilter();
      });

      marker.addTo(treesLayer);
      treeMarkers[tree.id] = marker;

      // Label
      const label = L.marker([tree.lat, tree.lng], {
        icon: L.divIcon({
          className: 'tree-label',
          html: tree.id
        }),
        interactive: false
      }).addTo(labelsLayer);
      treeLabelMarkers[tree.id] = label;
    }

    // Draw zones
    zones.forEach(zone => {
      L.polygon(zone.boundary, {
        color: '#3b82f6',
        weight: 2,
        fillColor: '#3b82f6',
        fillOpacity: 0.15,
        interactive: false
      }).addTo(zonesLayer);
    });

    // Draw trees
    trees.forEach(t => addTreeToMap(t));

    // Map click for adding
    map.on('click', function(e) {
      if (isAddingTree) {
        showAddModal(e.latlng.lat, e.latlng.lng);
      }
    });

    // Save data
    function saveData() {
      localStorage.setItem('trees', JSON.stringify(trees));
      localStorage.setItem('treeCounter', treeCounter.toString());
      updateStats();
    }

    // Update stats
    function updateStats() {
      document.getElementById('statTotal').textContent = trees.length;
      document.getElementById('statLow').textContent = trees.filter(t => t.risk === 'low').length;
      document.getElementById('statMedium').textContent = trees.filter(t => t.risk === 'medium').length;
      document.getElementById('statHigh').textContent = trees.filter(t => t.risk === 'high').length;
    }

    // Tree hierarchy
    function buildHierarchy() {
      const hierarchy = { name: 'Mandai Wildlife Reserve', children: [] };

      zones.forEach(zone => {
        const zoneTrees = trees.filter(tree => isInZone(tree, zone));
        if (zoneTrees.length === 0) return;

        const zoneNode = { name: zone.name, type: 'zone', children: [] };
        const speciesGroups = {};

        zoneTrees.forEach(tree => {
          if (!speciesGroups[tree.species]) speciesGroups[tree.species] = [];
          speciesGroups[tree.species].push(tree);
        });

        Object.keys(speciesGroups).sort().forEach(species => {
          zoneNode.children.push({
            name: species,
            type: 'species',
            children: speciesGroups[species].map(tree => ({
              name: tree.id,
              type: 'tree',
              data: tree
            }))
          });
        });

        hierarchy.children.push(zoneNode);
      });

      // Unzoned trees
      const unzonedTrees = trees.filter(tree => !zones.some(zone => isInZone(tree, zone)));
      if (unzonedTrees.length > 0) {
        const unzonedNode = { name: 'Other Areas', type: 'zone', children: [] };
        const speciesGroups = {};

        unzonedTrees.forEach(tree => {
          if (!speciesGroups[tree.species]) speciesGroups[tree.species] = [];
          speciesGroups[tree.species].push(tree);
        });

        Object.keys(speciesGroups).sort().forEach(species => {
          unzonedNode.children.push({
            name: species,
            type: 'species',
            children: speciesGroups[species].map(tree => ({
              name: tree.id,
              type: 'tree',
              data: tree
            }))
          });
        });

        hierarchy.children.push(unzonedNode);
      }

      return hierarchy;
    }

    function isInZone(tree, zone) {
      const [minLat, minLng] = zone.boundary[0];
      const [maxLat, maxLng] = zone.boundary[2];
      return tree.lat >= minLat && tree.lat <= maxLat && tree.lng >= minLng && tree.lng <= maxLng;
    }

    // Store expanded state
    const expandedNodes = new Set(['Mandai Wildlife Reserve']);

    function renderTreeView() {
      const container = document.getElementById('treeView');
      container.innerHTML = '';
      const hierarchy = buildHierarchy();
      renderNode(hierarchy, container, 0);
    }

    function renderNode(node, container, level) {
      const item = document.createElement('div');
      item.className = 'tree-item rounded px-2 py-1 cursor-pointer';
      item.style.paddingLeft = `${level * 16 + 8}px`;

      const hasChildren = node.children && node.children.length > 0;
      const isTree = node.type === 'tree';
      const isExpanded = expandedNodes.has(node.name);

      let icon = '';
      if (isTree) {
        const color = riskColors[node.data.risk].color;
        icon = `<span class="w-3 h-3 rounded-full inline-block" style="background: ${color}"></span>`;
      } else if (node.type === 'species') {
        icon = `<svg class="w-4 h-4 text-green-400 inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L8 8H4l8 14 8-14h-4L12 2z"/></svg>`;
      } else {
        icon = `<svg class="w-4 h-4 text-amber-400 inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`;
      }

      const toggle = hasChildren
        ? `<svg class="w-3 h-3 text-slate-400 tree-toggle inline-block mr-1 ${isExpanded ? 'expanded' : ''}" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`
        : `<span class="w-3 h-3 inline-block mr-1"></span>`;

      item.innerHTML = `
        <div class="flex items-center gap-2 text-slate-300">
          ${toggle}
          ${icon}
          <span class="${isTree ? 'text-slate-400' : 'text-white'}">${node.name}</span>
          ${hasChildren ? `<span class="text-slate-500 text-xs">(${node.children.length})</span>` : ''}
        </div>
      `;

      container.appendChild(item);

      if (hasChildren) {
        const childrenContainer = document.createElement('div');
        childrenContainer.className = `tree-children ${isExpanded ? 'expanded' : ''}`;
        container.appendChild(childrenContainer);

        item.addEventListener('click', (e) => {
          e.stopPropagation();
          childrenContainer.classList.toggle('expanded');
          item.querySelector('.tree-toggle')?.classList.toggle('expanded');
          if (childrenContainer.classList.contains('expanded')) {
            expandedNodes.add(node.name);
          } else {
            expandedNodes.delete(node.name);
          }
        });

        node.children.forEach(child => renderNode(child, childrenContainer, level + 1));
      }

      if (isTree) {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          flyToTree(node.data);
        });
      }
    }

    function flyToTree(tree) {
      map.flyTo([tree.lat, tree.lng], 18, { duration: 0.5 });
      if (treeMarkers[tree.id]) {
        setTimeout(() => treeMarkers[tree.id].openPopup?.(), 500);
      }
    }

    // UI Setup
    document.getElementById('addTreeBtn').onclick = function() {
      isAddingTree = true;
      document.getElementById('addTreeMode').classList.remove('hidden');
      document.getElementById('addTreeBtn').classList.add('hidden');
      document.getElementById('map').style.cursor = 'crosshair';
    };

    document.getElementById('cancelAddTree').onclick = exitAddMode;

    function exitAddMode() {
      isAddingTree = false;
      document.getElementById('addTreeMode').classList.add('hidden');
      document.getElementById('addTreeBtn').classList.remove('hidden');
      document.getElementById('map').style.cursor = '';
    }

    function showAddModal(lat, lng) {
      exitAddMode();
      editingTreeId = null;
      treeCounter++;

      document.getElementById('modalTitle').textContent = 'New Tree';
      document.getElementById('treeId').value = 'T-' + String(treeCounter).padStart(3, '0');
      document.getElementById('treeSpecies').value = 'Rain Tree';
      document.querySelector('input[name="risk"][value="low"]').checked = true;
      document.getElementById('treeLat').value = lat.toFixed(6);
      document.getElementById('treeLng').value = lng.toFixed(6);
      document.getElementById('deleteTreeBtn').classList.add('hidden');
      document.getElementById('treeModal').classList.remove('hidden');
    }

    function showEditModal(tree) {
      editingTreeId = tree.id;
      document.getElementById('modalTitle').textContent = 'Edit Tree';
      document.getElementById('treeId').value = tree.id;
      document.getElementById('treeSpecies').value = tree.species;
      document.querySelector(`input[name="risk"][value="${tree.risk}"]`).checked = true;
      document.getElementById('treeLat').value = tree.lat.toFixed(6);
      document.getElementById('treeLng').value = tree.lng.toFixed(6);
      document.getElementById('deleteTreeBtn').classList.remove('hidden');
      document.getElementById('treeModal').classList.remove('hidden');
    }

    document.getElementById('cancelModal').onclick = closeModal;
    document.getElementById('treeModal').onclick = function(e) {
      if (e.target.id === 'treeModal') closeModal();
    };

    function closeModal() {
      document.getElementById('treeModal').classList.add('hidden');
      editingTreeId = null;
    }

    document.getElementById('saveTreeBtn').onclick = function() {
      const id = document.getElementById('treeId').value;
      const species = document.getElementById('treeSpecies').value;
      const risk = document.querySelector('input[name="risk"]:checked').value;
      const lat = parseFloat(document.getElementById('treeLat').value);
      const lng = parseFloat(document.getElementById('treeLng').value);

      if (editingTreeId) {
        const tree = trees.find(t => t.id === editingTreeId);
        if (tree) {
          tree.species = species;
          tree.risk = risk;
          treesLayer.removeLayer(treeMarkers[tree.id]);
          labelsLayer.removeLayer(treeLabelMarkers[tree.id]);
          delete treeMarkers[tree.id];
          delete treeLabelMarkers[tree.id];
          addTreeToMap(tree);
        }
      } else {
        const newTree = { id, species, lat, lng, risk };
        trees.push(newTree);
        addTreeToMap(newTree);
      }

      saveData();
      renderTreeView();
      closeModal();
    };

    document.getElementById('deleteTreeBtn').onclick = function() {
      if (!editingTreeId) return;
      trees = trees.filter(t => t.id !== editingTreeId);
      if (treeMarkers[editingTreeId]) {
        treesLayer.removeLayer(treeMarkers[editingTreeId]);
        delete treeMarkers[editingTreeId];
      }
      if (treeLabelMarkers[editingTreeId]) {
        labelsLayer.removeLayer(treeLabelMarkers[editingTreeId]);
        delete treeLabelMarkers[editingTreeId];
      }
      saveData();
      renderTreeView();
      closeModal();
    };

    // Filter state
    let filteredTrees = [];
    let selectedTreeIndex = -1;

    // Dropdown toggles
    const speciesBtn = document.getElementById('speciesBtn');
    const speciesDropdown = document.getElementById('speciesDropdown');
    const riskBtn = document.getElementById('riskBtn');
    const riskDropdown = document.getElementById('riskDropdown');

    speciesBtn.onclick = (e) => {
      e.stopPropagation();
      speciesDropdown.classList.toggle('hidden');
      riskDropdown.classList.add('hidden');
    };

    riskBtn.onclick = (e) => {
      e.stopPropagation();
      riskDropdown.classList.toggle('hidden');
      speciesDropdown.classList.add('hidden');
    };

    document.addEventListener('click', () => {
      speciesDropdown.classList.add('hidden');
      riskDropdown.classList.add('hidden');
    });

    speciesDropdown.onclick = (e) => e.stopPropagation();
    riskDropdown.onclick = (e) => e.stopPropagation();

    // Populate species filter
    function populateSpeciesFilter() {
      const speciesList = document.getElementById('speciesList');
      const allSpecies = [...new Set(trees.map(t => t.species))].sort();

      speciesList.innerHTML = allSpecies.map(sp => {
        const checked = selectedSpecies.size === 0 || selectedSpecies.has(sp);
        const count = trees.filter(t => t.species === sp).length;
        return `
          <label class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/50 cursor-pointer">
            <input type="checkbox" value="${sp}" ${checked ? 'checked' : ''} class="species-cb accent-green-500">
            <span class="text-sm text-slate-300 flex-1">${sp}</span>
            <span class="text-xs text-slate-500">${count}</span>
          </label>
        `;
      }).join('');

      speciesList.querySelectorAll('.species-cb').forEach(cb => {
        cb.onchange = () => {
          updateSpeciesSelection();
          applyFilters();
        };
      });

      updateSpeciesLabel();
    }

    function updateSpeciesSelection() {
      const checkboxes = document.querySelectorAll('.species-cb');
      const allSpecies = [...new Set(trees.map(t => t.species))];
      selectedSpecies.clear();

      checkboxes.forEach(cb => {
        if (cb.checked) selectedSpecies.add(cb.value);
      });

      // If all or none selected, treat as "all"
      if (selectedSpecies.size === allSpecies.length) {
        selectedSpecies.clear();
      }

      updateSpeciesLabel();
    }

    function updateSpeciesLabel() {
      const label = document.getElementById('speciesLabel');
      if (selectedSpecies.size === 0) {
        label.textContent = 'All Species';
      } else if (selectedSpecies.size === 1) {
        label.textContent = [...selectedSpecies][0];
      } else {
        label.textContent = `${selectedSpecies.size} Species`;
      }
    }

    document.getElementById('speciesSelectAll').onclick = () => {
      document.querySelectorAll('.species-cb').forEach(cb => cb.checked = true);
      selectedSpecies.clear();
      updateSpeciesLabel();
      applyFilters();
    };

    // Populate risk filter
    function populateRiskFilter() {
      const riskList = document.getElementById('riskList');
      const risks = [
        { value: 'low', label: 'Low Risk', color: '#22c55e' },
        { value: 'medium', label: 'Medium Risk', color: '#f59e0b' },
        { value: 'high', label: 'High Risk', color: '#ef4444' }
      ];

      riskList.innerHTML = risks.map(r => {
        const checked = selectedRisks.has(r.value);
        const count = trees.filter(t => t.risk === r.value).length;
        return `
          <label class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/50 cursor-pointer">
            <input type="checkbox" value="${r.value}" ${checked ? 'checked' : ''} class="risk-cb accent-green-500">
            <span class="w-2.5 h-2.5 rounded-full" style="background:${r.color}"></span>
            <span class="text-sm text-slate-300 flex-1">${r.label}</span>
            <span class="text-xs text-slate-500">${count}</span>
          </label>
        `;
      }).join('');

      riskList.querySelectorAll('.risk-cb').forEach(cb => {
        cb.onchange = () => {
          updateRiskSelection();
          applyFilters();
        };
      });

      updateRiskLabel();
    }

    function updateRiskSelection() {
      selectedRisks.clear();
      document.querySelectorAll('.risk-cb').forEach(cb => {
        if (cb.checked) selectedRisks.add(cb.value);
      });
      updateRiskLabel();
    }

    function updateRiskLabel() {
      const label = document.getElementById('riskLabel');
      if (selectedRisks.size === 3) {
        label.textContent = 'All Risk';
      } else if (selectedRisks.size === 1) {
        const names = { low: 'Low', medium: 'Medium', high: 'High' };
        label.textContent = names[[...selectedRisks][0]] + ' Risk';
      } else if (selectedRisks.size === 0) {
        label.textContent = 'No Risk';
      } else {
        label.textContent = `${selectedRisks.size} Risks`;
      }
    }

    // Apply filters
    function applyFilters() {
      const hasFilter = selectedSpecies.size > 0 || selectedRisks.size < 3;

      filteredTrees = trees.filter(tree => {
        const matchesSpecies = selectedSpecies.size === 0 || selectedSpecies.has(tree.species);
        const matchesRisk = selectedRisks.has(tree.risk);
        return matchesSpecies && matchesRisk;
      });

      // Update marker opacity
      trees.forEach(tree => {
        const marker = treeMarkers[tree.id];
        const label = treeLabelMarkers[tree.id];
        if (!marker || !label) return;

        const matches = filteredTrees.includes(tree);
        const markerEl = marker.getElement();
        const labelEl = label.getElement();
        if (markerEl) markerEl.style.opacity = matches ? '1' : '0.2';
        if (labelEl) labelEl.style.opacity = matches ? '1' : '0.2';
      });

      // Update filtered panel
      updateFilteredPanel(hasFilter);
    }

    // Filtered Trees Panel
    function updateFilteredPanel(hasFilter) {
      const panel = document.getElementById('filteredPanel');

      if (!hasFilter) {
        panel.classList.add('hidden');
        selectedTreeIndex = -1;
        return;
      }

      panel.classList.remove('hidden');
      document.getElementById('filteredCount').textContent = `${filteredTrees.length} trees`;

      const list = document.getElementById('filteredTreeList');
      list.innerHTML = filteredTrees.map((tree, i) => {
        const color = riskColors[tree.risk].color;
        const isSelected = i === selectedTreeIndex;
        return `
          <button onclick="focusTree(${i})" class="w-full flex items-center gap-3 px-4 py-2.5 border-b border-slate-700 hover:bg-slate-700/50 transition-colors text-left ${isSelected ? 'bg-green-500/20' : ''}">
            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${color}"></span>
            <div class="flex-1 min-w-0">
              <div class="text-sm text-white ${isSelected ? 'text-green-400' : ''}">${tree.id}</div>
              <div class="text-xs text-slate-400">${tree.species}</div>
            </div>
          </button>
        `;
      }).join('') || '<div class="px-4 py-3 text-sm text-slate-400 text-center">No trees match</div>';

      updateNavigation();
    }

    window.focusTree = function(index) {
      if (index < 0 || index >= filteredTrees.length) return;
      selectedTreeIndex = index;
      const tree = filteredTrees[index];
      map.flyTo([tree.lat, tree.lng], 18, { duration: 0.5 });
      updateFilteredPanel(true);
    };

    document.getElementById('prevTreeBtn').onclick = () => {
      if (filteredTrees.length === 0) return;
      const newIndex = selectedTreeIndex <= 0 ? filteredTrees.length - 1 : selectedTreeIndex - 1;
      focusTree(newIndex);
    };

    document.getElementById('nextTreeBtn').onclick = () => {
      if (filteredTrees.length === 0) return;
      const newIndex = selectedTreeIndex >= filteredTrees.length - 1 ? 0 : selectedTreeIndex + 1;
      focusTree(newIndex);
    };

    document.getElementById('closeFilteredPanel').onclick = () => {
      // Reset filters
      selectedSpecies.clear();
      selectedRisks = new Set(['low', 'medium', 'high']);
      populateSpeciesFilter();
      populateRiskFilter();
      applyFilters();
    };

    function updateNavigation() {
      const nav = document.getElementById('treeNavIndex');
      if (filteredTrees.length === 0) {
        nav.textContent = '- / 0';
      } else if (selectedTreeIndex >= 0) {
        nav.textContent = `${selectedTreeIndex + 1} / ${filteredTrees.length}`;
      } else {
        nav.textContent = `- / ${filteredTrees.length}`;
      }
    }

    // KML Export
    document.getElementById('exportKmlBtn').onclick = function() {
      const hierarchy = buildHierarchy();
      let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Mandai Wildlife Reserve - Trees</name>
    <Style id="low-risk"><IconStyle><color>ff00c566</color><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/trees.png</href></Icon></IconStyle></Style>
    <Style id="medium-risk"><IconStyle><color>ff009ef5</color><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/trees.png</href></Icon></IconStyle></Style>
    <Style id="high-risk"><IconStyle><color>ff4444ef</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/trees.png</href></Icon></IconStyle></Style>
`;
      hierarchy.children.forEach(zone => {
        kml += `    <Folder><name>${zone.name}</name>\n`;
        zone.children.forEach(species => {
          kml += `      <Folder><name>${species.name}</name>\n`;
          species.children.forEach(tree => {
            kml += `        <Placemark><name>${tree.data.id}</name><description>Species: ${tree.data.species}\nRisk: ${riskColors[tree.data.risk].name}</description><styleUrl>#${tree.data.risk}-risk</styleUrl><Point><coordinates>${tree.data.lng},${tree.data.lat},0</coordinates></Point></Placemark>\n`;
          });
          kml += `      </Folder>\n`;
        });
        kml += `    </Folder>\n`;
      });
      kml += `  </Document>\n</kml>`;

      const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mandai-trees.kml';
      a.click();
    };

    // Reset button
    document.getElementById('resetBtn').onclick = function() {
      if (confirm('Reset all trees to default? This will clear your changes.')) {
        localStorage.removeItem('trees');
        localStorage.removeItem('treeCounter');
        location.reload();
      }
    };

    // Init
    renderTreeView();
    updateStats();
    populateSpeciesFilter();
    populateRiskFilter();
  </script>
</body>
</html>
