<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping - Mandai Wildlife</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            dark: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-['Inter']">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-xl border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-4">
      <div class="relative">
        <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 via-green-500 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/30 rotate-3 hover:rotate-0 transition-transform duration-300">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L8 8H4l8 14 8-14h-4L12 2zm0 3.5L14.5 10h2.2L12 18.5 7.3 10h2.2L12 5.5z"/>
          </svg>
        </div>
        <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-400 rounded-full border-2 border-white animate-pulse-slow"></div>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">Tree Mapping</h1>
        <p class="text-sm text-gray-500 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
          Mandai Wildlife Reserve
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Layers Dropdown -->
      <div class="relative">
        <button id="layersBtn" class="px-4 py-2.5 text-sm bg-white hover:bg-gray-50 text-gray-700 rounded-xl flex items-center gap-2 border border-gray-200 shadow-sm hover:shadow transition-all duration-200">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span>Layers</span>
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="layersDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-gray-200 z-[9999] overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
            <h3 class="text-sm font-semibold text-gray-800">Map Layers</h3>
            <p class="text-xs text-gray-500 mt-0.5">Toggle visibility</p>
          </div>
          <div id="layersList">
            <!-- Generated by layers.js -->
          </div>
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="group px-5 py-2.5 text-sm bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white rounded-xl flex items-center gap-2 shadow-lg shadow-green-500/25 hover:shadow-xl hover:shadow-green-500/30 transition-all duration-300 font-semibold hover:-translate-y-0.5">
        <svg class="w-4 h-4 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Add Tree</span>
      </button>
    </div>
  </header>

  <!-- Map Container -->
  <div class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>

    <!-- Stats Panel -->
    <div class="absolute top-5 left-5 bg-white/90 backdrop-blur-xl rounded-2xl shadow-xl border border-gray-200/50 p-5 z-[1000]">
      <div class="flex gap-6">
        <div class="text-center group">
          <div class="w-12 h-12 mx-auto mb-2 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
          </div>
          <div id="statTotal" class="text-2xl font-bold text-gray-800">50</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Total</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group">
          <div class="w-12 h-12 mx-auto mb-2 bg-gradient-to-br from-green-50 to-green-100 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="w-4 h-4 bg-gradient-to-br from-green-400 to-green-600 rounded-full shadow-lg shadow-green-500/30"></span>
          </div>
          <div id="statLow" class="text-2xl font-bold text-green-600">35</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Low</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group">
          <div class="w-12 h-12 mx-auto mb-2 bg-gradient-to-br from-amber-50 to-amber-100 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="w-4 h-4 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full shadow-lg shadow-amber-500/30"></span>
          </div>
          <div id="statMedium" class="text-2xl font-bold text-amber-600">10</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Medium</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group">
          <div class="w-12 h-12 mx-auto mb-2 bg-gradient-to-br from-red-50 to-red-100 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="w-4 h-4 bg-gradient-to-br from-red-400 to-red-600 rounded-full shadow-lg shadow-red-500/30"></span>
          </div>
          <div id="statHigh" class="text-2xl font-bold text-red-600">5</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">High</div>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="absolute bottom-5 left-5 bg-white/90 backdrop-blur-xl rounded-2xl shadow-xl border border-gray-200/50 px-5 py-3 z-[1000]">
      <div class="flex items-center gap-1 text-xs text-gray-500 mb-2 font-medium uppercase tracking-wider">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Risk Level
      </div>
      <div class="flex items-center gap-4 text-sm">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-green-50 rounded-lg">
          <span class="w-3 h-3 rounded-full bg-gradient-to-br from-green-400 to-green-600 shadow shadow-green-500/30"></span>
          <span class="text-green-700 font-medium">Low</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 bg-amber-50 rounded-lg">
          <span class="w-3 h-3 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 shadow shadow-amber-500/30"></span>
          <span class="text-amber-700 font-medium">Medium</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 bg-red-50 rounded-lg">
          <span class="w-3 h-3 rounded-full bg-gradient-to-br from-red-400 to-red-600 shadow shadow-red-500/30"></span>
          <span class="text-red-700 font-medium">High</span>
        </div>
      </div>
    </div>

    <!-- Add Tree Mode Indicator -->
    <div id="addTreeMode" class="hidden absolute top-5 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-500 to-green-600 text-white px-6 py-4 rounded-2xl shadow-2xl shadow-green-500/30 z-[9999] flex items-center gap-4">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center animate-bounce">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <div>
        <div class="font-semibold">Add New Tree</div>
        <div class="text-sm text-white/80">Click anywhere on map to place</div>
      </div>
      <button id="cancelAddTree" class="ml-2 px-4 py-2 bg-white/20 hover:bg-white/30 rounded-xl text-sm font-medium transition-all hover:scale-105">Cancel</button>
    </div>
  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[9999]">
    <div class="bg-white rounded-3xl shadow-2xl w-[400px] border border-gray-200 overflow-hidden transform transition-all">
      <!-- Modal Header -->
      <div class="bg-gradient-to-r from-emerald-500 to-green-600 px-6 py-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2L8 8H4l8 14 8-14h-4L12 2zm0 3.5L14.5 10h2.2L12 18.5 7.3 10h2.2L12 5.5z"/>
            </svg>
          </div>
          <h2 id="modalTitle" class="text-xl font-bold text-white">New Tree</h2>
        </div>
        <button id="cancelModal" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white/20 hover:bg-white/30 transition-all hover:rotate-90 duration-300">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Hidden inputs for ID and coordinates -->
      <input type="hidden" id="treeId">
      <input type="hidden" id="treeLat">
      <input type="hidden" id="treeLng">

      <!-- Modal Body -->
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2 font-semibold">Species</label>
          <div class="relative">
            <select id="treeSpecies" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition-all appearance-none cursor-pointer font-medium">
              <option value="Rain Tree">🌳 Rain Tree</option>
              <option value="Tembusu">🌲 Tembusu</option>
              <option value="Angsana">🌴 Angsana</option>
              <option value="Sea Apple">🍎 Sea Apple</option>
              <option value="Yellow Flame">🌻 Yellow Flame</option>
              <option value="Saga">🌿 Saga</option>
              <option value="Frangipani">🌸 Frangipani</option>
            </select>
            <svg class="w-5 h-5 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-500 uppercase tracking-wider mb-3 font-semibold">Risk Level</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="cursor-pointer group">
              <input type="radio" name="risk" value="low" checked class="peer sr-only">
              <div class="px-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-xl text-center text-sm text-gray-600 peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700 transition-all group-hover:border-gray-300 group-hover:bg-gray-100">
                <span class="block w-4 h-4 mx-auto mb-2 rounded-full bg-gradient-to-br from-green-400 to-green-600 shadow-lg shadow-green-500/30"></span>
                <span class="font-semibold">Low</span>
              </div>
            </label>
            <label class="cursor-pointer group">
              <input type="radio" name="risk" value="medium" class="peer sr-only">
              <div class="px-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-xl text-center text-sm text-gray-600 peer-checked:bg-amber-50 peer-checked:border-amber-500 peer-checked:text-amber-700 transition-all group-hover:border-gray-300 group-hover:bg-gray-100">
                <span class="block w-4 h-4 mx-auto mb-2 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 shadow-lg shadow-amber-500/30"></span>
                <span class="font-semibold">Medium</span>
              </div>
            </label>
            <label class="cursor-pointer group">
              <input type="radio" name="risk" value="high" class="peer sr-only">
              <div class="px-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-xl text-center text-sm text-gray-600 peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700 transition-all group-hover:border-gray-300 group-hover:bg-gray-100">
                <span class="block w-4 h-4 mx-auto mb-2 rounded-full bg-gradient-to-br from-red-400 to-red-600 shadow-lg shadow-red-500/30"></span>
                <span class="font-semibold">High</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-3 px-6 pb-6">
        <button id="deleteTreeBtn" class="hidden px-4 py-3.5 bg-red-50 border border-red-200 text-red-600 rounded-xl hover:bg-red-100 transition-all group">
          <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-xl hover:from-emerald-600 hover:to-green-700 transition-all font-semibold shadow-lg shadow-green-500/25 hover:shadow-xl hover:shadow-green-500/30 hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Save Tree
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="layers.js"></script>
  <script src="app.js"></script>
</body>
</html>
