<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping - Mandai Wildlife</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            dark: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-900 h-screen flex flex-col font-['Inter']">

  <!-- Header -->
  <header class="bg-gradient-to-r from-dark-800 to-dark-900 border-b border-white/10 px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-emerald-600 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/25">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L8 8H4l8 14 8-14h-4L12 2zm0 3.5L14.5 10h2.2L12 18.5 7.3 10h2.2L12 5.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold text-white">Tree Mapping</h1>
        <p class="text-xs text-gray-400">Mandai Wildlife Reserve</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Layers Dropdown -->
      <div class="relative">
        <button id="layersBtn" class="px-4 py-2.5 text-sm bg-white/5 hover:bg-white/10 text-white rounded-xl flex items-center gap-2 border border-white/10 transition-all duration-200">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span>Layers</span>
          <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="layersDropdown" class="hidden absolute right-0 mt-2 w-72 bg-dark-800/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/10 z-[9999] overflow-hidden">
          <div class="px-4 py-3 border-b border-white/10 bg-white/5">
            <h3 class="text-sm font-semibold text-white">Map Layers</h3>
            <p class="text-xs text-gray-400 mt-0.5">Toggle visibility</p>
          </div>
          <div id="layersList">
            <!-- Generated by layers.js -->
          </div>
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="px-4 py-2.5 text-sm bg-gradient-to-r from-primary-500 to-emerald-500 hover:from-primary-600 hover:to-emerald-600 text-white rounded-xl flex items-center gap-2 shadow-lg shadow-primary-500/25 transition-all duration-200 font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Add Tree</span>
      </button>
    </div>
  </header>

  <!-- Map Container -->
  <div class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>

    <!-- Stats Panel -->
    <div class="absolute top-5 left-5 bg-dark-800/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/10 p-4 z-[1000]">
      <div class="flex gap-5">
        <div class="text-center">
          <div id="statTotal" class="text-2xl font-bold text-white">50</div>
          <div class="text-[10px] text-gray-400 uppercase tracking-wider">Total</div>
        </div>
        <div class="w-px bg-white/10"></div>
        <div class="text-center">
          <div id="statLow" class="text-2xl font-bold text-green-400">35</div>
          <div class="text-[10px] text-gray-400 uppercase tracking-wider">Low</div>
        </div>
        <div class="w-px bg-white/10"></div>
        <div class="text-center">
          <div id="statMedium" class="text-2xl font-bold text-amber-400">10</div>
          <div class="text-[10px] text-gray-400 uppercase tracking-wider">Med</div>
        </div>
        <div class="w-px bg-white/10"></div>
        <div class="text-center">
          <div id="statHigh" class="text-2xl font-bold text-red-400">5</div>
          <div class="text-[10px] text-gray-400 uppercase tracking-wider">High</div>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="absolute bottom-5 left-5 bg-dark-800/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/10 px-4 py-3 z-[1000]">
      <div class="flex items-center gap-5 text-sm">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-green-500 shadow shadow-green-500/50"></span>
          <span class="text-white/80">Low</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-500 shadow shadow-amber-500/50"></span>
          <span class="text-white/80">Medium</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500 shadow shadow-red-500/50"></span>
          <span class="text-white/80">High</span>
        </div>
      </div>
    </div>

    <!-- Add Tree Mode Indicator -->
    <div id="addTreeMode" class="hidden absolute top-5 left-1/2 -translate-x-1/2 bg-gradient-to-r from-primary-500 to-emerald-500 text-white px-5 py-3 rounded-2xl shadow-2xl shadow-primary-500/30 z-[9999] flex items-center gap-3">
      <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center animate-pulse">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <span class="font-medium">Click on map to place tree</span>
      <button id="cancelAddTree" class="ml-1 px-3 py-1.5 bg-white/20 hover:bg-white/30 rounded-lg text-sm transition-all">Cancel</button>
    </div>
  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[9999]">
    <div class="bg-dark-800 rounded-3xl shadow-2xl w-[380px] border border-white/10 overflow-hidden">
      <!-- Modal Header -->
      <div class="bg-gradient-to-r from-primary-500 to-emerald-500 px-6 py-4">
        <h2 id="modalTitle" class="text-lg font-semibold text-white">New Tree</h2>
      </div>

      <!-- Modal Body -->
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Tree ID</label>
          <input type="text" id="treeId" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-primary-500/50 focus:ring-1 focus:ring-primary-500/50 transition-all" readonly>
        </div>

        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Species</label>
          <select id="treeSpecies" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary-500/50 focus:ring-1 focus:ring-primary-500/50 transition-all appearance-none cursor-pointer">
            <option value="Rain Tree">Rain Tree</option>
            <option value="Tembusu">Tembusu</option>
            <option value="Angsana">Angsana</option>
            <option value="Sea Apple">Sea Apple</option>
            <option value="Yellow Flame">Yellow Flame</option>
            <option value="Saga">Saga</option>
            <option value="Frangipani">Frangipani</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Risk Level</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="low" checked class="peer sr-only">
              <div class="px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-center text-sm text-white/70 peer-checked:bg-green-500/20 peer-checked:border-green-500/50 peer-checked:text-green-400 transition-all">
                <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5"></span>Low
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="medium" class="peer sr-only">
              <div class="px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-center text-sm text-white/70 peer-checked:bg-amber-500/20 peer-checked:border-amber-500/50 peer-checked:text-amber-400 transition-all">
                <span class="inline-block w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>Med
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="high" class="peer sr-only">
              <div class="px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-center text-sm text-white/70 peer-checked:bg-red-500/20 peer-checked:border-red-500/50 peer-checked:text-red-400 transition-all">
                <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5"></span>High
              </div>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Latitude</label>
            <input type="text" id="treeLat" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white/60 text-sm focus:outline-none font-mono" readonly>
          </div>
          <div>
            <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Longitude</label>
            <input type="text" id="treeLng" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white/60 text-sm focus:outline-none font-mono" readonly>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-3 px-6 pb-6">
        <button id="cancelModal" class="flex-1 px-4 py-3 border border-white/10 rounded-xl text-white/70 hover:bg-white/5 hover:text-white transition-all">Cancel</button>
        <button id="deleteTreeBtn" class="hidden px-4 py-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl hover:bg-red-500/20 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-3 bg-gradient-to-r from-primary-500 to-emerald-500 text-white rounded-xl hover:from-primary-600 hover:to-emerald-600 transition-all font-medium shadow-lg shadow-primary-500/25">Save Tree</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="layers.js"></script>
  <script src="app.js"></script>
</body>
</html>
