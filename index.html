<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping - Mandai Wildlife</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            dark: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-['Inter']">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L8 8H4l8 14 8-14h-4L12 2zm0 3.5L14.5 10h2.2L12 18.5 7.3 10h2.2L12 5.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold text-gray-900">Tree Mapping</h1>
        <p class="text-xs text-gray-500">Mandai Wildlife Reserve</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Layers Dropdown -->
      <div class="relative">
        <button id="layersBtn" class="px-3 py-2 text-sm bg-white hover:bg-gray-50 text-gray-700 rounded-lg flex items-center gap-2 border border-gray-300">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span>Layers</span>
          <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="layersDropdown" class="hidden absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg border border-gray-200 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-gray-100 bg-gray-50">
            <h3 class="text-sm font-medium text-gray-800">Map Layers</h3>
          </div>
          <div id="layersList">
            <!-- Generated by layers.js -->
          </div>
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="group px-4 py-2 text-sm bg-green-500 hover:bg-green-600 text-white rounded-lg flex items-center gap-2 font-medium shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5">
        <svg class="w-4 h-4 group-hover:rotate-90 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Add Tree</span>
      </button>
    </div>
  </header>

  <!-- Map Container -->
  <div class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>

    <!-- Stats Panel -->
    <div class="absolute top-4 left-4 bg-white rounded-lg shadow-md border border-gray-200 p-3 z-[1000]">
      <div class="flex gap-4">
        <div class="text-center group cursor-default">
          <div id="statTotal" class="text-xl font-bold text-gray-800 group-hover:scale-110 transition-transform">50</div>
          <div class="text-[10px] text-gray-500 uppercase">Total</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-green-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statLow" class="text-xl font-bold text-gray-800 group-hover:text-green-600 transition-colors">35</span>
          </div>
          <div class="text-[10px] text-gray-500 uppercase">Low</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-amber-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statMedium" class="text-xl font-bold text-gray-800 group-hover:text-amber-600 transition-colors">10</span>
          </div>
          <div class="text-[10px] text-gray-500 uppercase">Medium</div>
        </div>
        <div class="w-px bg-gray-200"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statHigh" class="text-xl font-bold text-gray-800 group-hover:text-red-600 transition-colors">5</span>
          </div>
          <div class="text-[10px] text-gray-500 uppercase">High</div>
        </div>
      </div>
    </div>


    <!-- Add Tree Mode Indicator -->
    <div id="addTreeMode" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-[9999] flex items-center gap-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      <span class="text-sm font-medium">Click on map to place tree</span>
      <button id="cancelAddTree" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm">Cancel</button>
    </div>
  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[9999]">
    <div class="bg-white rounded-lg shadow-xl w-[360px] border border-gray-200 overflow-hidden">
      <!-- Modal Header -->
      <div class="bg-green-500 px-5 py-3 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-semibold text-white">New Tree</h2>
        <button id="cancelModal" class="w-7 h-7 flex items-center justify-center rounded bg-white/20 hover:bg-white/30 transition-all hover:rotate-90 duration-200">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Hidden inputs for ID and coordinates -->
      <input type="hidden" id="treeId">
      <input type="hidden" id="treeLat">
      <input type="hidden" id="treeLng">

      <!-- Modal Body -->
      <div class="p-5 space-y-4">
        <div>
          <label class="block text-xs text-gray-500 uppercase mb-1.5">Species</label>
          <select id="treeSpecies" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500">
            <option value="Rain Tree">Rain Tree</option>
            <option value="Tembusu">Tembusu</option>
            <option value="Angsana">Angsana</option>
            <option value="Sea Apple">Sea Apple</option>
            <option value="Yellow Flame">Yellow Flame</option>
            <option value="Saga">Saga</option>
            <option value="Frangipani">Frangipani</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-500 uppercase mb-1.5">Risk Level</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="low" checked class="peer sr-only">
              <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-center text-sm text-gray-600 peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 mr-1"></span>Low
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="medium" class="peer sr-only">
              <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-center text-sm text-gray-600 peer-checked:bg-amber-50 peer-checked:border-amber-500 peer-checked:text-amber-700">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-1"></span>Med
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="high" class="peer sr-only">
              <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-center text-sm text-gray-600 peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 mr-1"></span>High
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-2 px-5 pb-5">
        <button id="deleteTreeBtn" class="hidden px-3 py-2 bg-red-50 border border-red-200 text-red-600 rounded-lg hover:bg-red-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5">
          Save Tree
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="layers.js"></script>
  <script src="app.js"></script>
</body>
</html>
