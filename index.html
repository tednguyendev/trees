<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping - Mandai Wildlife</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            dark: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 h-screen flex flex-col font-['Inter']">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L8 8H4l8 14 8-14h-4L12 2zm0 3.5L14.5 10h2.2L12 18.5 7.3 10h2.2L12 5.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-semibold text-white">Tree Mapping</h1>
        <p class="text-xs text-slate-400">Mandai Wildlife Reserve</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Filter by Species -->
      <div class="relative">
        <button id="filterBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <span id="filterLabel">All Species</span>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="filterDropdown" class="hidden absolute right-0 mt-2 w-48 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-slate-700">
            <h3 class="text-sm font-medium text-white">Filter by Species</h3>
          </div>
          <div id="filterList">
            <!-- Generated by app.js -->
          </div>
        </div>
      </div>

      <!-- Risk Filter -->
      <div class="relative">
        <button id="riskFilterBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span id="riskFilterLabel">All Risk</span>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="riskFilterDropdown" class="hidden absolute right-0 mt-2 w-40 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div id="riskFilterList">
            <!-- Generated by app.js -->
          </div>
        </div>
      </div>

      <!-- Zone Dropdown -->
      <div class="relative">
        <button id="zoneBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>Zones</span>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="zoneDropdown" class="hidden absolute right-0 mt-2 w-56 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-slate-700">
            <h3 class="text-sm font-medium text-white">Zoom to Zone</h3>
          </div>
          <div id="zoneList">
            <!-- Generated by app.js -->
          </div>
        </div>
      </div>

      <!-- Layers Dropdown -->
      <div class="relative">
        <button id="layersBtn" class="px-3 py-2 text-sm bg-slate-700 hover:bg-slate-600 text-white rounded-lg flex items-center gap-2 border border-slate-600 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span>Layers</span>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="layersDropdown" class="hidden absolute right-0 mt-2 w-64 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[9999] overflow-hidden">
          <div class="px-4 py-2 border-b border-slate-700">
            <h3 class="text-sm font-medium text-white">Map Layers</h3>
          </div>
          <div id="layersList">
            <!-- Generated by layers.js -->
          </div>
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="group px-4 py-2 text-sm bg-green-500 hover:bg-green-600 text-white rounded-lg flex items-center gap-2 font-medium shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5">
        <svg class="w-4 h-4 group-hover:rotate-90 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Add Tree</span>
      </button>
    </div>
  </header>

  <!-- Map Container -->
  <div class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>

    <!-- Stats Panel -->
    <div class="absolute top-4 left-4 bg-slate-800 rounded-lg shadow-lg border border-slate-700 p-3 z-[1000]">
      <div class="flex gap-4">
        <div class="text-center group cursor-default">
          <div id="statTotal" class="text-xl font-bold text-white group-hover:scale-110 transition-transform">50</div>
          <div class="text-[10px] text-slate-400 uppercase">Total</div>
        </div>
        <div class="w-px bg-slate-700"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-green-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statLow" class="text-xl font-bold text-white group-hover:text-green-400 transition-colors">35</span>
          </div>
          <div class="text-[10px] text-slate-400 uppercase">Low</div>
        </div>
        <div class="w-px bg-slate-700"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-amber-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statMedium" class="text-xl font-bold text-white group-hover:text-amber-400 transition-colors">10</span>
          </div>
          <div class="text-[10px] text-slate-400 uppercase">Medium</div>
        </div>
        <div class="w-px bg-slate-700"></div>
        <div class="text-center group cursor-default">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full group-hover:scale-125 transition-transform"></span>
            <span id="statHigh" class="text-xl font-bold text-white group-hover:text-red-400 transition-colors">5</span>
          </div>
          <div class="text-[10px] text-slate-400 uppercase">High</div>
        </div>
      </div>
    </div>


    <!-- Add Tree Mode Indicator -->
    <div id="addTreeMode" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-[9999] flex items-center gap-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      <span class="text-sm font-medium">Click on map to place tree</span>
      <button id="cancelAddTree" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm">Cancel</button>
    </div>

    <!-- Filtered Trees Panel -->
    <div id="filteredPanel" class="hidden absolute top-4 right-4 w-64 bg-slate-800 rounded-lg shadow-lg border border-slate-700 z-[1000] flex flex-col max-h-[calc(100%-2rem)]">
      <!-- Header -->
      <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-medium text-white">Filtered Trees</h3>
          <p id="filteredCount" class="text-xs text-slate-400">0 trees</p>
        </div>
        <button id="closeFilteredPanel" class="w-6 h-6 flex items-center justify-center rounded hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Tree List -->
      <div id="filteredTreeList" class="flex-1 overflow-y-auto">
        <!-- Generated by app.js -->
      </div>

      <!-- Navigation Footer -->
      <div class="px-3 py-2 border-t border-slate-700 flex items-center justify-between gap-2">
        <button id="prevTreeBtn" class="flex-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded text-sm flex items-center justify-center gap-1 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Prev
        </button>
        <span id="treeNavIndex" class="text-xs text-slate-400 min-w-[60px] text-center">1 / 10</span>
        <button id="nextTreeBtn" class="flex-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded text-sm flex items-center justify-center gap-1 transition-colors">
          Next
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[9999]">
    <div class="bg-slate-800 rounded-lg shadow-xl w-[360px] border border-slate-700 overflow-hidden">
      <!-- Modal Header -->
      <div class="bg-green-500 px-5 py-3 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-semibold text-white">New Tree</h2>
        <button id="cancelModal" class="w-7 h-7 flex items-center justify-center rounded bg-white/20 hover:bg-white/30 transition-all hover:rotate-90 duration-200">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Hidden inputs for ID and coordinates -->
      <input type="hidden" id="treeId">
      <input type="hidden" id="treeLat">
      <input type="hidden" id="treeLng">

      <!-- Modal Body -->
      <div class="p-5 space-y-4">
        <div>
          <label class="block text-xs text-slate-400 uppercase mb-1.5">Species</label>
          <select id="treeSpecies" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-green-500">
            <option value="Rain Tree">Rain Tree</option>
            <option value="Tembusu">Tembusu</option>
            <option value="Angsana">Angsana</option>
            <option value="Sea Apple">Sea Apple</option>
            <option value="Yellow Flame">Yellow Flame</option>
            <option value="Saga">Saga</option>
            <option value="Frangipani">Frangipani</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 uppercase mb-1.5">Risk Level</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="low" checked class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-green-500/20 peer-checked:border-green-500 peer-checked:text-green-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 mr-1"></span>Low
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="medium" class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-1"></span>Med
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="risk" value="high" class="peer sr-only">
              <div class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-center text-sm text-slate-300 peer-checked:bg-red-500/20 peer-checked:border-red-500 peer-checked:text-red-400 transition-all">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 mr-1"></span>High
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-2 px-5 pb-5">
        <button id="deleteTreeBtn" class="hidden px-3 py-2 bg-red-500/20 border border-red-500/50 text-red-400 rounded-lg hover:bg-red-500/30 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5">
          Save Tree
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="layers.js"></script>
  <script src="app.js"></script>
</body>
</html>
