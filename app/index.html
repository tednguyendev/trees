<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Mapping</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl">🌳</span>
      <h1 class="text-lg font-semibold text-gray-800">Tree Mapping</h1>
    </div>

    <div class="flex items-center gap-2">
      <!-- Layers Dropdown -->
      <div class="relative">
        <button id="layersBtn" class="px-3 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center gap-2">
          <span>Layers</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="layersDropdown" class="hidden absolute right-0 mt-1 w-64 bg-white rounded-lg shadow-lg border z-[9999] overflow-hidden">
          <!-- Generated by layers.js -->
        </div>
      </div>

      <!-- Add Tree Button -->
      <button id="addTreeBtn" class="px-3 py-2 text-sm bg-green-600 hover:bg-green-700 text-white rounded-lg flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span>Add Tree</span>
      </button>

    </div>
  </header>

  <!-- Map Container -->
  <div class="flex-1 relative">
    <div id="map" class="w-full h-full"></div>

    <!-- Legend -->
    <div class="absolute bottom-4 left-4 bg-white rounded-lg shadow-lg px-4 py-2 z-[1000]">
      <div class="flex items-center gap-4 text-sm">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <span>Low Risk</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-amber-500"></span>
          <span>Medium</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-red-500"></span>
          <span>High</span>
        </div>
      </div>
    </div>

    <!-- Add Tree Mode Indicator -->
    <div id="addTreeMode" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-[9999] flex items-center gap-2">
      <span>Click on map to place tree</span>
      <button id="cancelAddTree" class="ml-2 px-2 py-0.5 bg-green-700 hover:bg-green-800 rounded text-sm">Cancel</button>
    </div>
  </div>

  <!-- Add/Edit Tree Modal -->
  <div id="treeModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[9999]">
    <div class="bg-white rounded-xl shadow-xl w-80 p-5">
      <h2 id="modalTitle" class="text-lg font-semibold mb-4">New Tree</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Tree ID</label>
          <input type="text" id="treeId" class="w-full px-3 py-2 border rounded-lg bg-gray-50" readonly>
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">Species</label>
          <select id="treeSpecies" class="w-full px-3 py-2 border rounded-lg">
            <option value="Rain Tree">Rain Tree</option>
            <option value="Tembusu">Tembusu</option>
            <option value="Angsana">Angsana</option>
            <option value="Sea Apple">Sea Apple</option>
            <option value="Yellow Flame">Yellow Flame</option>
            <option value="Saga">Saga</option>
            <option value="Frangipani">Frangipani</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">Risk Level</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="risk" value="low" checked class="text-green-600">
              <span class="text-sm">Low</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="risk" value="medium" class="text-amber-600">
              <span class="text-sm">Medium</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="risk" value="high" class="text-red-600">
              <span class="text-sm">High</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">Latitude</label>
            <input type="text" id="treeLat" class="w-full px-3 py-2 border rounded-lg bg-gray-50 text-sm" readonly>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">Longitude</label>
            <input type="text" id="treeLng" class="w-full px-3 py-2 border rounded-lg bg-gray-50 text-sm" readonly>
          </div>
        </div>
      </div>

      <div class="flex gap-2 mt-5">
        <button id="cancelModal" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</button>
        <button id="deleteTreeBtn" class="hidden px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg">Delete</button>
        <button id="saveTreeBtn" class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="layers.js"></script>
  <script src="app.js"></script>
</body>
</html>
